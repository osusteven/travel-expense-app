name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :core:test

      # The app needs app/google-services.json from your Firebase project (see README).
      # If it isn't committed, build with a placeholder so CI still checks that the code compiles;
      # that APK won't be able to sync.
      - name: Firebase config
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "::warning::app/google-services.json not found; building with a placeholder (sync will not work in this APK)"
            cp .github/ci/google-services.placeholder.json app/google-services.json
          fi

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TravelSplit-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Screenshots
        run: ./gradlew :app:recordRoborazziDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/build/screenshots/*.png
